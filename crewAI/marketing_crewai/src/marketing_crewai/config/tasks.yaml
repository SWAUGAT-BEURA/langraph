research_task:
  description: >
    Conduct a thorough research about {topic}
    Make sure you find any interesting and relevant information given
    the current year is {current_year}.
  expected_output: >
    A markdown with all relevant ad engaging content pieces as reference
  agent: research_agent

writer_task:
  description: >
    Take the reference materials provided and create a comprehensive marketing
    report on the specified topic. The report should include:
    1. An engaging title and introduction.
    2. Analysis of current trends and market insights.
    3. Key findings and recommendations.
    4. Actionable strategies for leveraging the research.
    5. A concluding summary.
  expected_output: >
    A fully fledged markdown report with the main topics, each with a full section of information.
    Formatted as markdown without '```'
  agent: writer_agent

content_reviewer_task:
  description: >
    Review the marketing report and ensure that it is accurate, engaging, and
    aligned with brand voice and marketing objectives.

  expected_output: >
    A refined version of the marketing report with all the suggested changes.
    Formatted as markdown without '```'
  agent: content_reviewer_agent
